[package]
name = "drift-kernel"
version = "1.0.0"
edition = "2021"
description = "Bounded-Error Numerical Primitives - Neumaier-compensated summation"
authors = ["Armonti Du-Bose-Hill <armonti@onlysg.solutions>"]
license = "Apache-2.0"
readme = "README.md"
keywords = ["physics", "deterministic", "neumaier", "game-engine"]
categories = ["mathematics", "simulation", "game-engines"]

[lib]
name = "drift_kernel"
crate-type = ["rlib", "cdylib"]

[features]
default = []
ffi = []

[dependencies]

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "accumulator"
harness = false
