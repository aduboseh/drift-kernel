name: Public surface guard

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  scg-ban:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if SCG branding strings appear in public files
        shell: bash
        run: |
          set -euo pipefail

          targets=(README.md Cargo.toml include/*.h)
          while IFS= read -r -d '' f; do targets+=("$f"); done < <(find src -type f -name '*.rs' -print0)

          check() {
            local pattern="$1"
            if grep -nF "$pattern" "${targets[@]}"; then
              echo "::error ::Forbidden string '$pattern' found in public surface files"
              exit 1
            fi
          }

          check "SCG"
          check "Synthetic Cognitive"
